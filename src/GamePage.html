<!DOCTYPE html>
<html lang="en" class="mdui-theme-dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Page</title>
    <link rel="stylesheet" href="../node_modules/mdui/mdui.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <script src="../node_modules/mdui/mdui.global.js"></script>
    <link rel="stylesheet" href="styles/gamePage.css">
    <link rel="stylesheet" href="styles/index.css">
</head>
<body id="gamePage">
      <section id="gameBanner">
          <h2 id="gameTitle">Game Title</h2>
          <div class="game-status">
            <p>
              <img src="public/svg-spinners--clock.svg" alt="clock">
              Time Played: <span id="time-played">00:00:00</span>
            </p>
            <p>
              <img src="public/clarity--date-line.svg" alt="date">
              Status: <span id="install-status">Checking...</span>
            </p>   
          </div>
      </section>
      <section id="gameInfo">
          <div class="gameDescription">
              <h3>Game Description: </h3>
              <p id="gdText">Aqui ficara a descrição do jogo</p>
          </div>
          <div class="game-tags" id="game-tags">
          </div>
      </section>
      <footer class="footer">
          <div id="installProgressContainer" style="display: none; align-items: center; gap: 12px; flex: 1; margin-right: 20px;">
              <span id="installProgressText" style="font-size: 14px; font-weight: 500; min-width: 140px; color: white;">Baixando jogo...</span>
              <mdui-linear-progress style="flex: 1;"></mdui-linear-progress>
          </div>
          <mdui-button variant="outlined" id="backButton">Back</mdui-button>
          <mdui-button variant="filled" id="playButton">Jogar</mdui-button>
      </footer>
      <script src="../dist/scripts/gamePage.js"></script>
</body>
</html>
